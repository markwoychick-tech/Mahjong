<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahjong Jeopardy Deluxe+</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#0b3d2e;
    color:white;
    margin:0;
    padding:0;
}
header{
    background:#07251c;
    padding:15px;
    text-align:center;
    font-size:2em;
    font-weight:bold;
}
#board{
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    gap:6px;
    padding:10px;
}
.category{
    background:#124d3b;
    padding:10px;
    text-align:center;
    font-weight:bold;
    min-height:60px;
}
.clue{
    background:#1f7a5a;
    padding:20px 5px;
    text-align:center;
    cursor:pointer;
    font-size:1.3em;
    border-radius:8px;
}
.clue.used{
    visibility:hidden;
}
#modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
}
#modalContent{
    background:#fff;
    color:#000;
    padding:20px;
    width:85%;
    max-width:900px;
    border-radius:16px;
    text-align:center;
}
button{
    padding:10px 18px;
    margin:8px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:1em;
}
#scores{
    display:flex;
    justify-content:center;
    gap:25px;
    padding:10px;
    font-size:1.1em;
    background:#07251c;
}
.tile{
    width:70px;
    height:90px;
    background:#fff;
    border:3px solid #ddd;
    border-radius:10px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin:6px;
    color:#000;
    font-size:2em;
    font-weight:bold;
}
.answerTile{
    cursor:pointer;
    transition:transform .2s;
}
.answerTile:hover{
    transform:scale(1.08);
}
.hand{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
}
.small{
    font-size:1.2em;
}
</style>
</head>
<body>

<header>🀄 Mahjong Jeopardy Deluxe+</header>

<div id="scores"></div>

<div id="board"></div>

<div id="modal">
    <div id="modalContent">
        <div id="questionArea"></div>
        <div id="answerArea"></div>
        <button onclick="closeModal()">Close</button>
    </div>
</div>

<script>
const teams = [
    {name:"Player 1", score:0},
    {name:"Player 2", score:0}
];

function renderScores(){
    let html = "";
    teams.forEach((t,i)=>{
        html += `<div>${t.name}: <strong>${t.score}</strong>
        <button onclick="adjustScore(${i},100)">+100</button>
        <button onclick="adjustScore(${i},-100)">-100</button>
        </div>`;
    });
    document.getElementById("scores").innerHTML = html;
}

function adjustScore(i,val){
    teams[i].score += val;
    renderScores();
}

function tile(symbol){
    return `<div class="tile">${symbol}</div>`;
}

function answerTile(symbol, correct){
    return `<div class="tile answerTile" onclick="tileAnswer(${correct})">${symbol}</div>`;
}

function tileAnswer(correct){
    if(correct){
        document.getElementById("answerArea").innerHTML =
            "<h2>✅ Correct!</h2>";
    } else {
        document.getElementById("answerArea").innerHTML =
            "<h2>❌ Not quite.</h2>";
    }
}

const categories = [
{
title:"Tile Basics",
clues:[
{
value:100,
question:`Which tile is Bamboo 3?`,
answers:`
${answerTile("🀐",false)}
${answerTile("🀒",true)}
${answerTile("🀔",false)}
${answerTile("🀖",false)}
`
},
{
value:200,
question:`Which tile is Circle 5?`,
answers:`
${answerTile("🀝",false)}
${answerTile("🀙",false)}
${answerTile("🀜",true)}
${answerTile("🀞",false)}
`
},
{
value:300,
question:`Which tile is Character 9?`,
answers:`
${answerTile("🀇",false)}
${answerTile("🀏",true)}
${answerTile("🀋",false)}
${answerTile("🀍",false)}
`
},
{
value:400,
question:`Which tile is the Red Dragon?`,
answers:`
${answerTile("🀄",true)}
${answerTile("🀅",false)}
${answerTile("🀆",false)}
${answerTile("🀀",false)}
`
},
{
value:500,
question:`Which tile is the North Wind?`,
answers:`
${answerTile("🀁",false)}
${answerTile("🀂",false)}
${answerTile("🀃",true)}
${answerTile("🀀",false)}
`
}
]
},
{
title:"Complete the Hand",
clues:[
{
value:100,
question:`Which tile completes this pung? 
<div class="hand">${tile("🀙")}${tile("🀙")}</div>`,
answers:`
${answerTile("🀙",true)}
${answerTile("🀚",false)}
${answerTile("🀛",false)}
${answerTile("🀜",false)}
`
},
{
value:200,
question:`Which tile completes this chow? 
<div class="hand">${tile("🀇")}${tile("🀈")}</div>`,
answers:`
${answerTile("🀊",false)}
${answerTile("🀉",true)}
${answerTile("🀋",false)}
${answerTile("🀌",false)}
`
},
{
value:300,
question:`Which tile completes this pair?
<div class="hand">${tile("🀄")}</div>`,
answers:`
${answerTile("🀄",true)}
${answerTile("🀅",false)}
${answerTile("🀆",false)}
${answerTile("🀃",false)}
`
},
{
value:400,
question:`Which tile completes this chow?
<div class="hand">${tile("🀑")}${tile("🀒")}</div>`,
answers:`
${answerTile("🀓",true)}
${answerTile("🀔",false)}
${answerTile("🀕",false)}
${answerTile("🀖",false)}
`
},
{
value:500,
question:`Which tile completes this pung?
<div class="hand">${tile("🀂")}${tile("🀂")}</div>`,
answers:`
${answerTile("🀁",false)}
${answerTile("🀂",true)}
${answerTile("🀃",false)}
${answerTile("🀀",false)}
`
}
]
},
{
title:"Game Terms",
clues:[
{value:100, question:"What is a Pung?", answers:"<h3>A set of 3 identical tiles.</h3>"},
{value:200, question:"What is a Kong?", answers:"<h3>A set of 4 identical tiles.</h3>"},
{value:300, question:"What is a Chow?", answers:"<h3>A sequence of 3 suited tiles in order.</h3>"},
{value:400, question:"What is Mahjong?", answers:"<h3>A complete winning hand.</h3>"},
{value:500, question:"What is the Charleston?", answers:"<h3>A tile-passing phase in American Mahjong.</h3>"}
]
},
{
title:"Strategy",
clues:[
{value:100, question:"Why keep flexible tiles early?", answers:"<h3>They allow more possible hand directions.</h3>"},
{value:200, question:"Why watch discards?", answers:"<h3>They reveal what opponents may be building.</h3>"},
{value:300, question:"Why avoid exposing too early?", answers:"<h3>You reveal information about your hand.</h3>"},
{value:400, question:"Why collect pairs?", answers:"<h3>Many hands require at least one pair.</h3>"},
{value:500, question:"What is defensive play?", answers:"<h3>Discarding safely to avoid helping opponents.</h3>"}
]
},
{
title:"American Mahjong",
clues:[
{value:100, question:"What item lists legal hands?", answers:"<h3>The National Mah Jongg League card.</h3>"},
{value:200, question:"What special tile acts as a wildcard?", answers:"<h3>The Joker.</h3>"},
{value:300, question:"Can Jokers be used in pairs?", answers:"<h3>No.</h3>"},
{value:400, question:"Can a Joker be exchanged?", answers:"<h3>Yes, under certain rules.</h3>"},
{value:500, question:"What does calling a tile do?", answers:"<h3>Lets you expose tiles to complete a set.</h3>"}
]
},
{
title:"Final Concepts",
clues:[
{value:100, question:"How many tiles are in a Mahjong hand?", answers:"<h3>Typically 14.</h3>"},
{value:200, question:"What are honor tiles?", answers:"<h3>Winds and dragons.</h3>"},
{value:300, question:"What are suited tiles?", answers:"<h3>Bamboo, circles, and characters.</h3>"},
{value:400, question:"What is a concealed hand?", answers:"<h3>A hand with no exposed sets.</h3>"},
{value:500, question:"Why is Mahjong considered strategic?", answers:"<h3>It blends memory, probability, and adaptation.</h3>"}
]
}
];

function buildBoard(){
    let board = document.getElementById("board");
    let html = "";

    categories.forEach(cat=>{
        html += `<div class="category">${cat.title}</div>`;
    });

    for(let r=0;r<5;r++){
        categories.forEach((cat,c)=>{
            let clue = cat.clues[r];
            html += `<div class="clue" id="c${c}_${r}" onclick="showClue(${c},${r})">$${clue.value}</div>`;
        });
    }

    board.innerHTML = html;
}

function showClue(c,r){
    const clue = categories[c].clues[r];
    document.getElementById("questionArea").innerHTML =
        `<h2>${categories[c].title} - $${clue.value}</h2>
         <div class="small">${clue.question}</div>`;
    document.getElementById("answerArea").innerHTML = clue.answers;
    document.getElementById("modal").style.display = "flex";
    document.getElementById(`c${c}_${r}`).classList.add("used");
}

function closeModal(){
    document.getElementById("modal").style.display = "none";
}

renderScores();
buildBoard();
</script>

</body>
</html>
